name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      GOMEMLIMIT: 512MiB
      GOMAXPROCS: '2'
    steps:
      - name: Require successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ci_conclusion=$(gh run list --workflow ci.yml --branch main --event push \
            --commit "$GITHUB_SHA" --limit 1 --json conclusion --jq '.[0].conclusion')
          if [[ "$ci_conclusion" != success ]]; then
            echo 'CI must pass on main for this commit before releasing.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Build archives
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: v2.18.3
          args: release --clean --skip=publish --parallelism=1
      - name: Verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(dist/agsecret_linux_amd64_v1/agsecret --version)" = "agsecret $RELEASE_TAG"
          (cd dist && sha256sum --check checksums.txt)
          flags=(--latest)
          if [[ "$RELEASE_TAG" == *-* ]]; then flags=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
            --generate-notes "${flags[@]}" dist/*.tar.gz dist/*.zip dist/checksums.txt
