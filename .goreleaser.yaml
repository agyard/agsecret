version: 2
project_name: agsecret

builds:
  - id: agsecret
    main: ./cmd/agsecret
    binary: agsecret
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath, -p=1]
    ldflags:
      - -s -w -X github.com/agyard/agsecret/internal/cli.Version=v{{ .Version }}

archives:
  - id: agsecret
    ids: [agsecret]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - docs/architecture.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ .Version }}-dev"

changelog:
  disable: true
